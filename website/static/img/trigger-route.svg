<svg xmlns="http://www.w3.org/2000/svg" width="640" height="630" viewBox="0 0 640 630" role="img" aria-labelledby="title description">
  <title id="title">A conference key opens talking, with a permanent listening return</title>
  <desc id="description">The director's Key 1 sends their microphone to Show while held. Show feeds Lighting and Audio, and its listening return to the director remains available even when the key is released. Every conference listener hears the other contributors, with their own microphone removed.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1L7 4.5L1 8" fill="none" stroke="#a6c4f4" stroke-width="1.6"/></marker></defs>
  <style>
    text {font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#f0f3f7;text-anchor:middle}
    .label {font-size:27px;font-weight:600}.sub {font-size:22px;fill:#c5ced9}.note {font-size:23px;fill:#a6c4f4}
    .box {fill:#20262e;stroke:#566375;stroke-width:1.5}.wire {fill:none;stroke:#a6c4f4;stroke-width:2.5;marker-end:url(#arrow)}
  </style>
  <rect width="640" height="630" fill="#14171b"/>
  <path class="wire" d="M320 151V263"/>
  <path class="wire" d="M190 308H42V104H185"/>
  <path class="wire" d="M320 358V405H170V450"/>
  <path class="wire" d="M320 405H470V450"/>
  <rect class="box" x="190" y="55" width="260" height="96" rx="8"/>
  <text class="label" x="320" y="97">Director</text><text class="sub" x="320" y="130">Microphone and ear</text>
  <text class="note" x="437" y="195">Hold Key 1</text><text class="sub" x="437" y="225">to talk</text>
  <text class="note" x="154" y="195">Always</text><text class="sub" x="154" y="225">listening</text>
  <rect x="190" y="267" width="260" height="91" rx="8" fill="#25364c" stroke="#a6c4f4" stroke-width="1.5"/>
  <text class="label" x="320" y="307">Show</text><text class="sub" x="320" y="339">Conference mix</text>
  <rect class="box" x="40" y="454" width="260" height="78" rx="8"/>
  <text class="label" x="170" y="502">Lighting</text>
  <rect class="box" x="340" y="454" width="260" height="78" rx="8"/>
  <text class="label" x="470" y="502">Audio</text>
  <text class="sub" x="320" y="574">Each person hears the others,</text><text class="sub" x="320" y="602">with their own microphone removed (N-1).</text>
</svg>
