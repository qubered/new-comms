<svg xmlns="http://www.w3.org/2000/svg" width="640" height="570" viewBox="0 0 640 570" role="img" aria-labelledby="title description">
  <title id="title">An IFB combines program and an interrupt for one destination</title>
  <desc id="description">Program feeds the Presenter IFB continuously. The director opens a Call to IFB key to add their microphone. While that interrupt is open, the IFB dims or cuts program. The combined feed goes to the presenter station or a hardware earpiece output. Releasing the interrupt restores normal program.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1L7 4.5L1 8" fill="none" stroke="#a6c4f4" stroke-width="1.6"/></marker></defs>
  <style>
    text {font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#f0f3f7;text-anchor:middle}
    .label {font-size:27px;font-weight:600}.sub {font-size:22px;fill:#c5ced9}.note {font-size:23px;fill:#a6c4f4}
    .box {fill:#20262e;stroke:#566375;stroke-width:1.5}.wire {fill:none;stroke:#a6c4f4;stroke-width:2.5;marker-end:url(#arrow)}
  </style>
  <rect width="640" height="570" fill="#14171b"/>
  <path class="wire" d="M155 142V252"/><path class="wire" d="M485 142V252"/><path class="wire" d="M320 377V450"/>
  <rect class="box" x="30" y="48" width="250" height="94" rx="8"/>
  <text class="label" x="155" y="89">Program</text><text class="sub" x="155" y="120">Input or mix</text>
  <rect class="box" x="360" y="48" width="250" height="94" rx="8"/>
  <text class="label" x="485" y="89">Director</text><text class="sub" x="485" y="120">Call to IFB key</text>
  <rect x="55" y="176" width="200" height="33" fill="#14171b"/><text class="note" x="155" y="200">Program path</text>
  <rect x="405" y="176" width="160" height="33" fill="#14171b"/><text class="note" x="485" y="200">While held</text>
  <rect x="75" y="256" width="490" height="121" rx="8" fill="#25364c" stroke="#a6c4f4" stroke-width="1.5"/>
  <text class="label" x="320" y="295">Presenter IFB</text>
  <text class="sub" x="320" y="329">Program dims or cuts</text><text class="sub" x="320" y="358">while the interrupt is open</text>
  <text class="note" x="467" y="422">Combined feed</text>
  <rect class="box" x="125" y="454" width="390" height="91" rx="8"/>
  <text class="label" x="320" y="492">Destination</text><text class="sub" x="320" y="526">Presenter station or earpiece output</text>
</svg>
